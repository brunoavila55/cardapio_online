user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Backend API upstream
    upstream api_backend {
        server 127.0.0.1:3000; # Substitua pelo endereço do Node.js
    }

    # Redirecionar HTTP para HTTPS (Opcional, assumindo que SSL é mandatório)
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Server Block Principal (Root Domain: login de admin)
    server {
        listen 443 ssl;
        server_name subdominio.com.br;

        ssl_certificate /etc/nginx/ssl/wildcard.crt;
        ssl_certificate_key /etc/nginx/ssl/wildcard.key;

        root /var/www/cardapio_online/dist;
        index index.html;

        # Headers de segurança
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";

        # Arquivos Estáticos com Cache
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Proxy Reverso para API Node.js
        location /api/ {
            proxy_pass http://api_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            # Repassar IP Real e protocolo
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Uploads (Acesso direto)
        location /uploads/ {
            alias /var/www/cardapio_online/backend/uploads/;
            expires 30d;
        }

        # SPA Fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # Server Block Wildcard (Subdomínios dos Tenants)
    server {
        listen 443 ssl;
        server_name *.subdominio.com.br;

        ssl_certificate /etc/nginx/ssl/wildcard.crt;
        ssl_certificate_key /etc/nginx/ssl/wildcard.key;

        root /var/www/cardapio_online/dist;
        index index.html;

        # Headers de segurança
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";

        # Arquivos Estáticos com Cache
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Proxy Reverso para API Node.js
        location /api/ {
            proxy_pass http://api_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            # O Frontend é responsável por enviar X-Tenant-Slug, 
            # mas podemos garantir repasse de infos do Host.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Uploads (Acesso direto)
        location /uploads/ {
            alias /var/www/cardapio_online/backend/uploads/;
            expires 30d;
        }

        # SPA Fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
